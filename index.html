<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campus Video Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #eee; text-align: center;
  }
  h1 { padding: 16px; margin: 0; font-size: 1.3rem; }
  #status { color: #9cf; margin-bottom: 8px; min-height: 20px; }
  .videos {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    padding: 10px;
  }
  video {
    width: 90vw; max-width: 480px; background: #000;
    border-radius: 10px; aspect-ratio: 4/3;
  }
  .controls { padding: 16px; }
  button {
    font-size: 1rem; padding: 10px 20px; margin: 6px; border: none;
    border-radius: 8px; cursor: pointer; background: #3b82f6; color: white;
  }
  button:disabled { background: #555; cursor: not-allowed; }
  #skipBtn { background: #ef4444; }
</style>
</head>
<body>
<h1>🎥 Campus Random Video Chat</h1>
<div id="status">Click start to begin</div>

<div class="videos">
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="skipBtn" disabled>Skip / Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on("connect", () => console.log("[socket] connected, id:", socket.id));
socket.on("connect_error", (err) => {
  console.error("[socket] connect_error:", err.message);
  statusEl.textContent = "Can't reach the server (network may be blocking it). Try switching wifi/data.";
});
socket.io.on("reconnect_attempt", () => console.log("[socket] reconnecting..."));

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const skipBtn = document.getElementById("skipBtn");

let localStream = null;
let pc = null;

// Free STUN server (Google) + free TURN fallback (Open Relay Project / metered.ca)
// TURN is needed when two people are behind strict NATs/firewalls (common on campus wifi).
// The turns: (TLS, port 443, transport=tcp) entry is the important one for campus networks —
// it looks like normal HTTPS traffic, so it gets through firewalls that block plain UDP.
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  {
    urls: "turn:openrelay.metered.ca:80",
    username: "openrelayproject",
    credential: "openrelayproject"
  },
  {
    urls: "turn:openrelay.metered.ca:80?transport=tcp",
    username: "openrelayproject",
    credential: "openrelayproject"
  },
  {
    urls: "turn:openrelay.metered.ca:443",
    username: "openrelayproject",
    credential: "openrelayproject"
  },
  {
    urls: "turns:openrelay.metered.ca:443?transport=tcp",
    username: "openrelayproject",
    credential: "openrelayproject"
  }
];

function newPeerConnection(initiator) {
  const peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

  peer.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  peer.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit("signal", { type: "ice", candidate: event.candidate });
    }
  };

  peer.onconnectionstatechange = () => {
    console.log("[connectionState]", peer.connectionState);
    if (peer.connectionState === "connected") {
      statusEl.textContent = "Connected! Say hi 👋";
    }
    if (["disconnected", "failed", "closed"].includes(peer.connectionState)) {
      statusEl.textContent = "Connection lost. Click Skip to find someone new.";
    }
  };

  // Diagnostics: watch which ICE candidate pair actually wins.
  // "relay" = TURN was needed and used (expected for strict/campus NATs).
  // "srflx" = STUN was enough. "host" = direct LAN connection (same room/network).
  peer.oniceconnectionstatechange = async () => {
    console.log("[iceConnectionState]", peer.iceConnectionState);
    if (peer.iceConnectionState === "connected" || peer.iceConnectionState === "completed") {
      const stats = await peer.getStats();
      stats.forEach(report => {
        if (report.type === "candidate-pair" && report.state === "succeeded") {
          const local = stats.get(report.localCandidateId);
          const remote = stats.get(report.remoteCandidateId);
          if (local) console.log("[winning pair] local type:", local.candidateType, "| remote type:", remote?.candidateType);
        }
      });
    }
    if (peer.iceConnectionState === "failed") {
      console.warn("[ICE FAILED] TURN relay likely unreachable or blocked on this network.");
    }
  };

  if (initiator) {
    peer.onnegotiationneeded = async () => {
      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      socket.emit("signal", { type: "offer", sdp: peer.localDescription });
    };
  }

  return peer;
}

async function start() {
  startBtn.disabled = true;
  statusEl.textContent = "Requesting camera & mic access...";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;
  } catch (err) {
    statusEl.textContent = "Camera/mic permission denied. Please allow access and reload.";
    startBtn.disabled = false;
    return;
  }
  skipBtn.disabled = false;
  statusEl.textContent = "Looking for a match...";
  socket.emit("find-partner");
}

function cleanupConnection() {
  if (pc) {
    pc.close();
    pc = null;
  }
  remoteVideo.srcObject = null;
}

skipBtn.addEventListener("click", () => {
  cleanupConnection();
  statusEl.textContent = "Looking for a new match...";
  socket.emit("find-partner");
});

startBtn.addEventListener("click", start);

socket.on("waiting", () => {
  statusEl.textContent = "Waiting for someone to join...";
});

socket.on("matched", async ({ initiator }) => {
  statusEl.textContent = "Match found! Connecting...";
  cleanupConnection();
  pc = newPeerConnection(initiator);
});

socket.on("signal", async (data) => {
  if (!pc) return;
  if (data.type === "offer") {
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit("signal", { type: "answer", sdp: pc.localDescription });
  } else if (data.type === "answer") {
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
  } else if (data.type === "ice") {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch (e) {
      console.warn("ICE candidate error", e);
    }
  }
});

socket.on("partner-left", () => {
  cleanupConnection();
  statusEl.textContent = "Your partner left. Click Skip to find someone new.";
});

socket.on("left", () => {
  statusEl.textContent = "Looking for a new match...";
});
</script>
</body>
</html>
